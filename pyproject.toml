[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-dynamic-demo"
version = "0.1.0"
description = "Mockup of DataLab dynamic mode: live source and auto-updated processing result"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["datalab-platform >= 1.4, < 2"]
keywords = ["datalab", "datalab-plugin"]

[project.urls]
Homepage = "https://github.com/DataLab-Platform/datalab-dynamic-demo"
Issues = "https://github.com/DataLab-Platform/datalab-dynamic-demo/issues"

[project.entry-points."datalab.plugins"]
datalab_dynamic_demo = "datalab_dynamic_demo.adapters.desktop:DynamicModeDemoPlugin"

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
